name: Invoice intelligence checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install pytest boto3 psycopg2-binary aws-cdk-lib constructs -r src/web_portal/requirements.txt
      - run: python -m pytest tests/unit/test_intelligence*.py tests/unit/test_portal_auth.py tests/unit/test_portal_ui.py -q
